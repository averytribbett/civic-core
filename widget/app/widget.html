<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title data-i18n="chatWidget">Chat widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="widget.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="streaming-markdown.js"></script>

  <!-- i18n: locale files register on window.__CHAT_LOCALES, then i18n.js exposes the i18n API -->
  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/zh.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/pt.js"></script>
  <script src="locales/ar.js"></script>
  <script src="locales/ko.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <div id="chat">
    <header class="chat-header">
      <img id="chat-logo" class="chat-header-logo" src="" alt="" referrerpolicy="no-referrer" />
      <h1 id="chat-name" class="chat-header-name" data-i18n="headerDefaultName">Chat</h1>
      <div class="chat-header-lang-wrap">
        <button type="button" id="lang-trigger" class="chat-header-lang" aria-label="Language" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-dropdown"></button>
        <div id="lang-dropdown" class="chat-header-lang-dropdown" role="listbox" aria-labelledby="lang-trigger" aria-hidden="true"></div>
      </div>
      <button type="button" id="close" class="chat-header-close" aria-label="Close chat" data-i18n="headerCloseChat" data-i18n-attr="aria-label"><span aria-hidden="true">✕</span></button>
    </header>
    <main id="chat-main" class="messages-viewport">
      <div id="messages" class="messages" role="log" aria-label="Chat messages" data-i18n="messagesLabel" data-i18n-attr="aria-label">
        <div class="message agent">
          <div id="welcome-message" class="message-body" data-i18n="welcomeMessage"></div>
        </div>
      </div>
      <form id="form" class="input-form" aria-busy="false">
        <ul id="faq-suggestions" class="faq-suggestions" role="listbox" aria-label="Suggested questions" hidden data-i18n="faqSuggestionsLabel" data-i18n-attr="aria-label"></ul>
        <textarea id="input" rows="1" placeholder="Type a question..." aria-label="Type a question..." aria-describedby="input-disclaimer" aria-autocomplete="list" aria-controls="faq-suggestions" aria-expanded="false" autocomplete="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-i18n="placeholder" data-i18n-attr="placeholder,aria-label"></textarea>
        <button type="submit" class="send-btn" aria-label="Send" data-i18n="send" data-i18n-attr="aria-label">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(-45deg)" aria-hidden="true">
            <path d="M8.11093 4.32915L8.46424 3.66758L8.11093 4.32915ZM17.4348 9.30862L17.0815 9.97019L17.4348 9.30862ZM17.431 14.715L17.7832 15.3771L17.431 14.715ZM8.112 19.6729L7.75973 19.0108H7.75973L8.112 19.6729ZM4.14654 16.046L3.42831 15.83L4.14654 16.046ZM4.14065 7.95083L3.4222 8.16607L4.14065 7.95083ZM8.32953 12.7659C8.74375 12.7659 9.07953 12.4302 9.07953 12.0159C9.07953 11.6017 8.74375 11.2659 8.32953 11.2659V12.7659ZM7.75761 4.99071L17.0815 9.97019L17.7881 8.64706L8.46424 3.66758L7.75761 4.99071ZM17.0787 14.0529L7.75973 19.0108L8.46426 20.3351L17.7832 15.3771L17.0787 14.0529ZM4.86476 16.262L6.07675 12.2319L4.64031 11.7999L3.42831 15.83L4.86476 16.262ZM6.07698 11.8007L4.8591 7.73559L3.4222 8.16607L4.64008 12.2312L6.07698 11.8007ZM5.35853 12.7659H8.32953V11.2659H5.35853V12.7659ZM7.75973 19.0108C6.95053 19.4413 6.10735 19.2587 5.50636 18.7091C4.90044 18.1549 4.56934 17.2443 4.86476 16.262L3.42831 15.83C2.95775 17.3947 3.48692 18.8948 4.494 19.8159C5.50601 20.7415 7.02855 21.0989 8.46426 20.3351L7.75973 19.0108ZM17.0815 9.97019C18.6409 10.803 18.639 13.2228 17.0787 14.0529L17.7832 15.3771C20.4035 13.9831 20.4061 10.0452 17.7881 8.64706L17.0815 9.97019ZM8.46424 3.66758C7.02937 2.90128 5.50602 3.25644 4.49263 4.18085C3.48418 5.10076 2.95316 6.60051 3.4222 8.16607L4.8591 7.73559C4.56462 6.75266 4.89688 5.84243 5.50352 5.28905C6.10522 4.74018 6.94877 4.55875 7.75761 4.99071L8.46424 3.66758Z"/>
          </svg>
        </button>
        <div class="gradient gradient-top hidden"></div>
        <div class="gradient gradient-bottom hidden"></div>
      </form>
      <p id="input-disclaimer" class="input-disclaimer"><span data-i18n="disclaimer">AI can make mistakes. Verify important info.</span></p>
    </main>
  </div>

  <script src="widget.js"></script>
</body>
</html>
